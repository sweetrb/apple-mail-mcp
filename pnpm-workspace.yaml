# Single-package repo (no workspace packages). This file records pnpm's
# build-script approvals, which pnpm 11 reads only from here (the package.json
# "pnpm" field and .npmrc are no longer read, and the v10 onlyBuiltDependencies
# array was replaced by the allowBuilds map).
#
# This repo's dev toolchain (vitest 4 → rolldown, which ships prebuilt platform
# binaries) currently triggers no postinstall build scripts, so no approval is
# strictly required today. The esbuild entry is kept for parity with the sibling
# repos and as a guard: if a future dev dep pulls esbuild back in (it ships a
# postinstall), this pre-approves it so `pnpm install` won't fail with
# ERR_PNPM_IGNORED_BUILDS. Add any package pnpm later reports under "Ignored
# build scripts:" here.
allowBuilds:
  esbuild: true

# Pin pnpm 11's supply-chain minimum-release-age default explicitly (1440 min = 1 day)
# so it is documented and stable across pnpm upgrades. See https://pnpm.io/supply-chain-security.
minimumReleaseAge: 1440

# Keep transitive dependencies above their security floors until their direct
# parents' ranges move past the patched releases.
overrides:
  "@hono/node-server": 2.0.10
  # Preserve minimatch 3's CommonJS contract while applying the v1 security
  # backport for GHSA-mh99-v99m-4gvg.
  brace-expansion@<1.1.17: 1.1.17
  fast-uri: 3.1.4
  # Security floors for dev-only transitives (js-yaml via @eslint/eslintrc,
  # postcss via vite), originally added in 29b0221 to clear npm audit advisories
  # while this repo still used npm. pnpm has never read npm's bare top-level
  # package.json "overrides" field, so the floors went inert at the pnpm
  # migration; they live here now, which is the only place pnpm 11 reads them.
  # Both currently resolve above these ranges on their own — the overrides exist
  # so a future eslint/vite bump cannot drag them back down.
  js-yaml: ^4.2.0
  postcss: ^8.5.15
