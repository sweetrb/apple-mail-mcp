# Single-package repo (no workspace packages). This file records pnpm's
# build-script approvals, which pnpm 11 reads only from here (the package.json
# "pnpm" field and .npmrc are no longer read, and the v10 onlyBuiltDependencies
# array was replaced by the allowBuilds map).
#
# This repo's dev toolchain (vitest 4 → rolldown, which ships prebuilt platform
# binaries) currently triggers no postinstall build scripts, so no approval is
# strictly required today. The esbuild entry is kept for parity with the sibling
# repos and as a guard: if a future dev dep pulls esbuild back in (it ships a
# postinstall), this pre-approves it so `pnpm install` won't fail with
# ERR_PNPM_IGNORED_BUILDS. Add any package pnpm later reports under "Ignored
# build scripts:" here.
allowBuilds:
  esbuild: true

# Pin pnpm 11's supply-chain minimum-release-age default explicitly (1440 min = 1 day)
# so it is documented and stable across pnpm upgrades. See https://pnpm.io/supply-chain-security.
minimumReleaseAge: 1440

# Keep transitive dependencies above their security floors until their direct
# parents' ranges move past the patched releases.
overrides:
  "@hono/node-server": 2.0.10
  # GHSA-mh99-v99m-4gvg: floor each brace-expansion major independently on its
  # own complete (sequence-bounded) release. The bounds must be two-sided —
  # a bare "<5.0.9" also matches 1.1.18 and 2.1.4 under semver and would drag
  # minimatch 3's CommonJS path onto the v5 ESM API ("expand is not a function").
  "brace-expansion@>=1.0.0 <1.1.18": 1.1.18
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  # ⚠️ These are FLOORS, not pins. `fast-uri: 3.1.4` (exact) was written here as a
  # security floor and then became a CEILING: when GHSA-7p8r-x3mc-p8w7 landed with
  # a 3.1.5 fix, the exact pin held the tree on the vulnerable 3.1.4 and the
  # advisory could not clear. Use a caret range so patch fixes flow in on their own
  # while staying inside the major that the parent's API expects.
  fast-uri: ^3.1.5
  # GHSA-mwp4-54f8-5fhr (high) + GHSA-4xrf-jv44-h6hh + GHSA-22jq-vg5j-6vgg.
  # express-rate-limit -> @modelcontextprotocol/sdk pulled ip-address 10.2.0 while
  # imapflow -> socks already resolved a clean 10.3.1, so the tree carried two
  # copies and shipped the vulnerable one in the bundle. This floors both onto
  # 10.3.1 and dedupes them.
  ip-address: ^10.3.1
  # GHSA-8j4g-w8fx-2239 (moderate): ReDoS in Hono's CORS middleware, fixed in
  # 4.12.34. Deferred earlier the same day because that release was still inside
  # the 24h minimumReleaseAge soak — it missed by 41 minutes. No
  # minimumReleaseAgeExclude carve-out was ever added; the soak is the point.
  # It matured at 2026-08-04T02:36:40Z and is floored here now.
  hono: ^4.12.34
  js-yaml: ^4.2.0
  postcss: ^8.5.15
