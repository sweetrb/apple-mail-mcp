# Single-package repo (no workspace packages). This file records pnpm's
# build-script approvals, which pnpm 11 reads only from here (the package.json
# "pnpm" field and .npmrc are no longer read, and the v10 onlyBuiltDependencies
# array was replaced by the allowBuilds map).
#
# This repo's dev toolchain (vitest 4 → rolldown, which ships prebuilt platform
# binaries) currently triggers no postinstall build scripts, so no approval is
# strictly required today. The esbuild entry is kept for parity with the sibling
# repos and as a guard: if a future dev dep pulls esbuild back in (it ships a
# postinstall), this pre-approves it so `pnpm install` won't fail with
# ERR_PNPM_IGNORED_BUILDS. Add any package pnpm later reports under "Ignored
# build scripts:" here.
allowBuilds:
  esbuild: true

# Supply-chain soak: refuse any package version younger than 7 days (10080 min).
# Deliberately stricter than pnpm 11's 1440-minute default, and deliberately NOT
# redundant with dependabot.yml's 7-day cooldown: the cooldown governs only what
# Dependabot *proposes* (direct deps), while this governs everything a resolution
# *installs*. Transitive packages reach the lockfile without Dependabot ever seeing
# them -- apple-mail-mcp carried a 5-day-old transitive ip-address@10.5.0 under the
# 1440 default, which this value rejects. See https://pnpm.io/supply-chain-security.
#
# Cost of the stricter value, stated here so it is not rediscovered painfully: an
# urgent upstream fix cannot be installed until it is 7 days old. There is no
# minimumReleaseAgeExclude carve-out; if one is ever needed, add it narrowly and
# remove it once the version ages past the cutoff.
minimumReleaseAge: 10080

# Keep transitive dependencies above their security floors until their direct
# parents' ranges move past the patched releases.
overrides:
  "@hono/node-server": 2.0.10
  # GHSA-mh99-v99m-4gvg: floor each brace-expansion major independently on its
  # own complete (sequence-bounded) release. The bounds must be two-sided —
  # a bare "<5.0.9" also matches 1.1.18 and 2.1.4 under semver and would drag
  # minimatch 3's CommonJS path onto the v5 ESM API ("expand is not a function").
  "brace-expansion@>=1.0.0 <1.1.18": 1.1.18
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  # ⚠️ These are FLOORS, not pins. `fast-uri: 3.1.4` (exact) was written here as a
  # security floor and then became a CEILING: when GHSA-7p8r-x3mc-p8w7 landed with
  # a 3.1.5 fix, the exact pin held the tree on the vulnerable 3.1.4 and the
  # advisory could not clear. Use a two-sided range so patch fixes flow in on
  # their own while staying inside the major that ajv's API expects — never an
  # unbounded ">=" (could silently jump a future major) and never an exact pin
  # (becomes a ceiling again the next time this needs to move).
  # GHSA-5jgf-p345-68v8 (high, host confusion via skipped IDN canonicalization)
  # + GHSA-fph4-wmhf-6fwf (high, SSRF via repeated hostname percent-decoding):
  # both fixed in 3.1.6. Raised the floor from ^3.1.5 (which still permitted the
  # vulnerable 3.1.5 itself) to >=3.1.6 <4.
  fast-uri: ">=3.1.6 <4"
  # GHSA-mwp4-54f8-5fhr (high) + GHSA-4xrf-jv44-h6hh + GHSA-22jq-vg5j-6vgg.
  # express-rate-limit -> @modelcontextprotocol/sdk pulled ip-address 10.2.0 while
  # imapflow -> socks already resolved a clean 10.3.1, so the tree carried two
  # copies and shipped the vulnerable one in the bundle. This floors both onto
  # 10.3.1 and dedupes them.
  ip-address: ^10.3.1
  # GHSA-8j4g-w8fx-2239 (moderate): ReDoS in Hono's CORS middleware, fixed in
  # 4.12.34. Deferred earlier the same day because that release was still inside
  # the 24h minimumReleaseAge soak — it missed by 41 minutes. No
  # minimumReleaseAgeExclude carve-out was ever added; the soak is the point.
  # It matured at 2026-08-04T02:36:40Z and is floored here now.
  hono: ^4.12.34
  # GHSA-5p4m-2wfm-xmqj (high): quadratic CPU consumption resolving !!omap,
  # fixed in 4.3.1 — the CVE-2026-59870 fix was never backported to the 3.x line.
  # This entry already existed as `^4.2.0`, a floor for an earlier advisory, and
  # 4.2.0 is BELOW this fix: an out-of-date floor is not a failure mode a caret
  # protects against, because the caret only stops the tree going *backwards*.
  # Dev scope (js-yaml reaches the tree via eslint) and absent from the shipped
  # bundle, so nothing vulnerable was published.
  js-yaml: ^4.3.1
  # GHSA-fxqj-rqcc-2cmp (moderate): incomplete fix of GHSA-6g55-p6wh-862q — an
  # attacker-controlled sourceMappingURL can read arbitrary .map files when `from`
  # is unset. Patched in 8.5.23. This floor read `^8.5.15` — below the fix — so it
  # was not actually enforcing it; the tree only resolved a safe 8.5.25 because
  # vite's own range happened to pull it forward. Matches apple-notes/apple-photos.
  # Development scope only (vitest -> vite -> postcss), not in the shipped bundle.
  postcss: ^8.5.23
