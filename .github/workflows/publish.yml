# ┌─────────────────────────── RENAME HAZARD ───────────────────────────┐
# │ Three names in this pipeline are LOAD-BEARING COUPLINGS:            │
# │  1. This FILE's name (publish.yml) is the npm Trusted Publisher     │
# │     key — rename it and OIDC publishing breaks (photos hit this:    │
# │     auto-release.yml had to be renamed to match).                   │
# │  2. `workflows: [CI]` below matches ci.yml's `name:` — retitle CI   │
# │     and this workflow never fires again (the daily schedule below   │
# │     is the safety net that turns that silent break into a loud one).│
# │  3. ci.yml's `test` job + matrix [22, 24] produce the required      │
# │     branch-protection contexts `test (22)` / `test (24)` — rename   │
# │     the job or matrix and merges block on phantom checks.           │
# └─────────────────────────────────────────────────────────────────────┘
name: Publish to npm

on:
  release:
    types: [created]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual retry for a stranded publish (e.g. CI flake recovered by
  # re-dispatching CI, whose green run a workflow_run trigger would
  # otherwise accept only for `push` events).
  workflow_dispatch:
  # Daily watchdog: retries any pending publish (version on main absent from
  # npm) and self-heals a missed GitHub Release. Converts every silent
  # never-publish variant — severed trigger coupling, race, transient npm or
  # gh failure — into automatic recovery within 24h, or a RED run (email)
  # when recovery fails. Runs read-only when nothing is pending.
  schedule:
    - cron: "17 9 * * *"

# Each release can land multiple pushes on main in quick succession, so
# multiple CI runs complete and each triggers a publish. Without
# serialization they race: both read the pre-publish version, both attempt
# publish, and the loser fails with a 403 "cannot publish over existing
# version" (noisy failure emails). A concurrency group serializes them; the
# later run then sees the version already published and skips cleanly.
concurrency:
  group: publish-to-npm
  cancel-in-progress: false

# Least privilege at the top; each job grants only what it uses.
permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    if: >
      github.repository_owner == 'sweetrb' &&
      ((github.event_name == 'release') ||
       (github.event_name == 'workflow_dispatch') ||
       (github.event_name == 'schedule') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    # This job runs dependency code (pnpm install, lint, tests, build), so it
    # gets NO repository write access — only the OIDC token npm publishing
    # needs. The pipeline's one write, creating the GitHub Release, lives in the
    # `release` job below, which runs no dependency code.
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      sha: ${{ steps.pin.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the next step can prove the commit is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the CI-validated commit and prove it is on main
        id: pin
        # For workflow_run, publish exactly the commit CI validated — otherwise
        # a push landing between CI completion and this checkout publishes bytes
        # (and provenance, and a Release tag) that no CI run ever saw. The job
        # `if` above already admits only push/dispatch CI runs on main; the
        # ancestry check makes that structural, so nothing outside main's
        # history can ever be published. The SHA is applied here rather than as
        # checkout's `ref:` because OpenSSF Scorecard flags any
        # workflow_run-derived `ref:` as an untrusted checkout, whatever the job
        # `if` says. Other events keep their natural ref (main for
        # schedule/dispatch, the tag for release).
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            git checkout --quiet --detach "$HEAD_SHA"
          fi
          CANDIDATE_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main; then
            echo "::error::Candidate ${CANDIDATE_SHA} is not on origin/main; refusing to publish it."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Verify full CI for the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.pin.outputs.sha }}
        run: node .github/scripts/verify-publish-ci.mjs

      - name: Check if this exact version is already published
        id: check
        # Exact-version existence (`npm view pkg@version`), NOT latest-equality:
        # immune to the registry's `latest` CDN lag, and a manual Release
        # created for an old version is a clean no-op instead of a re-publish
        # attempt.
        run: |
          PKG=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          EXISTS=$(npm view "${PKG}@${LOCAL_VERSION}" version 2>/dev/null || echo "")
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$EXISTS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PKG}@${LOCAL_VERSION} is already on npm — nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${PKG}@${LOCAL_VERSION} is not on npm — publishing."
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Run linter
        if: steps.check.outputs.skip == 'false'
        run: pnpm run lint

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: pnpm test

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: pnpm run build

      # Validate the exact archive before publishing any npm bytes, including
      # manual/recovery paths. The release job consumes this same artifact.
      - name: Verify and package the standalone Codex plugin
        run: |
          node --test test/package-codex-plugin.test.mjs
          VERSION=$(node -p "require('./package.json').version")
          node scripts/package-codex-plugin.mjs "$RUNNER_TEMP/apple-mail-codex-plugin-v$VERSION.tar.gz"

      - name: Publish to npm (pnpm + OIDC trusted publishing)
        if: steps.check.outputs.skip == 'false'
        # `pnpm publish` does the OIDC exchange + provenance (no token).
        # `--no-git-checks` skips pnpm's clean-tree/branch guard, which CI
        # does not satisfy.
        #
        # Tolerate the publish race: the concurrency group serializes runs,
        # but npm's registry read lags the write by minutes, so a later run's
        # existence check can miss the version an earlier run just pushed,
        # attempt to publish, and be refused with a 403 "cannot publish over
        # existing version" or a 409 "Cannot publish over previously staged
        # version". That refusal IS npm saying the version exists, so it is
        # success. On 2026-10-07 the second of two runs ~7 min apart got the
        # 409 while `npm view pkg@version` still returned nothing for the
        # version the first run had published; a single re-check then failed a
        # healthy release. Any other failure gets a bounded `npm view` poll
        # before it is called real.
        run: |
          set -o pipefail
          PKG="${{ steps.check.outputs.pkg }}"
          LOCAL="${{ steps.check.outputs.local }}"
          LOG=$(mktemp)
          if pnpm publish --provenance --no-git-checks 2>&1 | tee "$LOG"; then
            echo "Published."
          elif grep -qiE 'cannot publish over (the )?(previously|existing)' "$LOG"; then
            echo "npm refused because ${PKG}@${LOCAL} already exists (published or staged by an earlier run); treating as success."
          else
            NOW_EXISTS=""
            for _ in 1 2 3 4 5 6; do
              NOW_EXISTS=$(npm view "${PKG}@${LOCAL}" version 2>/dev/null || echo "")
              [ -n "$NOW_EXISTS" ] && break
              sleep 15
            done
            if [ -n "$NOW_EXISTS" ]; then
              echo "${PKG}@${LOCAL} is already on npm (published by a concurrent run); treating as success."
            else
              echo "::error::pnpm publish failed and ${PKG}@${LOCAL} is not on npm."
              exit 1
            fi
          fi

      - name: Skip publish (version already published)
        if: steps.check.outputs.skip == 'true'
        run: echo "Version ${{ steps.check.outputs.local }} is already published. Skipping."

      - name: Upload the release plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-plugin-release-${{ steps.pin.outputs.sha }}
          path: ${{ runner.temp }}/apple-mail-codex-plugin-v*.tar.gz
          if-no-files-found: error

  release:
    # Self-healing GitHub Release sync. It runs after EVERY successful publish
    # job, including runs that skipped an already-published version, and is
    # idempotent via `gh release view`. So a Release missed by a transient
    # failure earlier is healed by ANY later run, the daily schedule included.
    # This is the only job with a write token, and it runs no dependency code:
    # checkout, artifact download, jq, awk, git and gh only.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false

      - name: Sync GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          VERSION=$(jq -r .version package.json)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
          else
            NOTES=$(awk -v v="## [$VERSION]" 'index($0,v)==1{p=1;next} p&&/^## \[/{exit} p' CHANGELOG.md)
            [ -z "$NOTES" ] && NOTES="Published to npm as v$VERSION."
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "v$VERSION" --notes "$NOTES" \
              || echo "::warning::Failed to create GitHub Release v$VERSION (will self-heal on the next run)"
          fi

      - name: Download this commit's verified plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-plugin-release-${{ needs.publish.outputs.sha }}
          path: release-assets

      - name: Attach the standalone plugin to its release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          ASSET="apple-mail-codex-plugin-v$VERSION.tar.gz"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"; then
            echo "Plugin archive is already attached; preserving the published asset."
            exit 0
          fi
          git fetch --depth=1 origin "refs/tags/v$VERSION"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$SHA" ]; then
            echo "::error::Release tag does not identify the packaged commit; refusing to attach mismatched bytes."
            exit 1
          fi
          gh release upload "v$VERSION" "release-assets/$ASSET" --repo "$GITHUB_REPOSITORY"
