name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Verify committed build/ matches source
        run: |
          if ! git diff --quiet build/; then
            echo "::error::build/ is out of date. Run 'npm run build' locally and commit the changes."
            git --no-pager diff --stat build/
            exit 1
          fi

  # IMAP backend integration tests run against a real IMAP server (GreenMail).
  # Unlike the Mail.app integration suite, the IMAP code path needs no macOS, so
  # this runs on Linux with GreenMail as a service container. (#43 / A2)
  imap-integration:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.0
        ports:
          - 3143:3143
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=tester:secret@example.com
            -Dgreenmail.verbose
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # --force bypasses EBADPLATFORM: package.json declares os:["darwin"], but
        # the IMAP code path is platform-agnostic and runs fine on Linux here.
        run: npm ci --force

      - name: Wait for GreenMail IMAP (localhost:3143)
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3143) >/dev/null 2>&1; then echo "IMAP up"; exit 0; fi
            sleep 1
          done
          echo "::error::GreenMail IMAP did not become ready"; exit 1

      - name: Run IMAP integration tests
        run: npm run test:imap
        env:
          RUN_IMAP_IT: "1"
          GREENMAIL_HOST: 127.0.0.1
          GREENMAIL_IMAP_PORT: "3143"
          GREENMAIL_USER: tester
          GREENMAIL_PASS: secret
