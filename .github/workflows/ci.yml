name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-dispatched by dependabot-rebuild.yml after it pushes a rebuilt bundle to
  # a Dependabot PR branch: a GITHUB_TOKEN push only creates held,
  # approval-required pull_request runs, so the required checks have to be
  # re-run via dispatch to complete on the new head.
  workflow_dispatch:

# Least privilege: CI only needs to read the repo (checkout + pnpm). Publishing
# and code-scanning grant their own scoped tokens in their own workflows.
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      # pnpm 11.9 (packageManager) requires Node >= 22.13, so CI exercises the
      # dev toolchain on 22 (LTS) and 24 (current). The published server itself
      # still runs on Node >= 20 (engines.node) — pnpm is dev/CI-only.
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root skills/ is canonical; codex/skills/ and .antigravity-plugin/skills/
      # are generated copies. Fails when they drift (fix: pnpm run sync:skills).
      - name: Verify skill copies match skills/
        run: node scripts/sync-skills.mjs --check

      - name: Run linter
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        if: matrix.node-version == 22
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Verify committed build/ matches source
        run: |
          if ! git diff --quiet build/; then
            echo "::error::build/ is out of date. Run 'pnpm run build' locally and commit the changes."
            git --no-pager diff --stat build/
            exit 1
          fi

      - name: outputSchema contract (boots the built server over stdio)
        if: matrix.node-version == 22
        run: pnpm exec vitest run --config vitest.integration.config.ts test/output-schema.test.ts

  # IMAP backend integration tests run against a real IMAP server (GreenMail).
  # Unlike the Mail.app integration suite, the IMAP code path needs no macOS, so
  # this runs on Linux with GreenMail as a service container. (#43 / A2)
  imap-integration:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.0
        ports:
          - 3143:3143
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=tester:secret@example.com
            -Dgreenmail.verbose
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        # pnpm does not enforce the ROOT package's `os: ["darwin"]` field (only
        # dependencies' platform constraints), so a plain frozen install works on
        # Linux here — no `--force` equivalent needed (npm ci required `--force`
        # to bypass EBADPLATFORM). The IMAP code path is platform-agnostic.
        run: pnpm install --frozen-lockfile

      - name: Wait for GreenMail IMAP (localhost:3143)
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3143) >/dev/null 2>&1; then echo "IMAP up"; exit 0; fi
            sleep 1
          done
          echo "::error::GreenMail IMAP did not become ready"; exit 1

      - name: Run IMAP integration tests
        run: pnpm run test:imap
        env:
          RUN_IMAP_IT: "1"
          GREENMAIL_HOST: 127.0.0.1
          GREENMAIL_IMAP_PORT: "3143"
          GREENMAIL_USER: tester
          GREENMAIL_PASS: secret
